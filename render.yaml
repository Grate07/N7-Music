services:
  - type: web
    name: n7-music-bot
    runtime: node
    # Free services can sleep; UptimeRobot can keep this HTTP health endpoint warm.
    # This is best-effort 24/7 hosting, not a guaranteed always-on instance.
    plan: free
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @workspace/discord-bot run build
    startCommand: pnpm --filter @workspace/discord-bot run start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: NODE_ENV
        value: production